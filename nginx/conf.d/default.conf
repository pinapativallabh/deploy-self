# Bonk dashboard — default server block.
# Catches all requests that don't match a deployed app's server_name.
server {
    listen 80 default_server;
    server_name _;

    # Proxy to frontend by default
    location / {
        proxy_pass http://bonk-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket support (for Next.js HMR in dev)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Proxy to backend for API
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://bonk-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy to backend for health check
    location /health {
        proxy_pass http://bonk-backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
