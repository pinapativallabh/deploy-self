version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: forge-deploy-postgres
    environment:
      POSTGRES_USER: forgeadmin
      POSTGRES_PASSWORD: forgepassword
      POSTGRES_DB: forgedeploy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: forge-deploy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forge-deploy-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forge-deploy-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: always

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: forge-deploy-worker
    env_file:
      - ./worker/.env
    depends_on:
      - redis
    restart: always

volumes:
  postgres_data:
  redis_data:
