version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: forge-deploy-postgres
    environment:
      POSTGRES_USER: forgeadmin
      POSTGRES_PASSWORD: forgepassword
      POSTGRES_DB: forgedeploy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: forge-deploy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
