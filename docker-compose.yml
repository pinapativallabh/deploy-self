networks:
  bonk_net:
    name: bonk_net

services:
  postgres:
    image: postgres:15-alpine
    container_name: bonk-postgres
    environment:
      POSTGRES_USER: bonk
      POSTGRES_PASSWORD: bonk_dev_password
      POSTGRES_DB: bonk
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonk"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - bonk_net

  redis:
    image: redis:7-alpine
    container_name: bonk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - bonk_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bonk-backend
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REPO_CACHE_PATH: /app/storage/repos
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PUBLIC_PORT: ${PUBLIC_PORT:-8080}
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - repos_data:/app/storage/repos
      - logs_data:/app/storage/logs
      - ./nginx/conf.d/apps:/app/nginx/conf.d/apps
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: always
    networks:
      - bonk_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:${PUBLIC_PORT:-8080}/api
    container_name: bonk-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - bonk_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bonk-worker
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REPO_CACHE_PATH: /app/storage/repos
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PUBLIC_PORT: ${PUBLIC_PORT:-8080}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - repos_data:/app/storage/repos
      - logs_data:/app/storage/logs
      - ./nginx/conf.d/apps:/app/nginx/conf.d/apps
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - bonk_net

  nginx:
    image: nginx:alpine
    container_name: bonk-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - bonk_net

volumes:
  postgres_data:
  redis_data:
  repos_data:
  logs_data:
