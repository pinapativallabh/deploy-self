# Alembic Configuration
#
# This file is read by Alembic at migration runtime.
# It configures the migration environment, script location, and logging.

[alembic]
# Path to the migration scripts directory, relative to this file.
script_location = alembic

# Template used to generate migration file names.
# Includes a short revision hash and a slugified description for readability.
# Example: 001a2b3c_create_users_table.py
file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps.
# Note: Commented out because dateutil can't resolve 'UTC' on some Windows
# configurations. Local time is used instead for migration filenames.
# timezone = UTC

# Set to true to prepend sys.path with the current directory,
# allowing local imports (e.g., from app.core.config) to work.
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
datefmt = %Y-%m-%d %H:%M:%S
